<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Matches --panel (see src/index.css) so the mobile status bar/task
         switcher chrome doesn't clash with the top bar right under it.
         Kept in sync with the resolved theme by /theme-init.js
         (first paint, loaded below) and lib/theme.ts's applyTheme() (later switches). -->
    <meta name="theme-color" content="#171717" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Rona</title>
    <script src="/theme-init.js"></script>
  </head>
  <body class="bg-app text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
