<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <!-- Matches --panel (see src/index.css) so the mobile status bar/task
         switcher chrome doesn't clash with the top bar right under it.
         Kept in sync with the resolved theme by the inline script below
         (first paint) and lib/theme.ts's applyTheme() (later switches). -->
    <meta name="theme-color" content="#171717" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>Rona</title>
    <script>
      (function () {
        var root = document.documentElement;
        var dark = true;
        try {
          var stored = localStorage.getItem("rona:theme");
          var mode = stored === "light" || stored === "dark" ? stored : "system";
          dark =
            mode === "dark" ||
            (mode === "system" &&
              window.matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {
          // private mode / storage unavailable: fall back to dark
        }
        root.classList.toggle("dark", dark);
        root.style.colorScheme = dark ? "dark" : "light";
        root.style.backgroundColor = dark ? "#0f1115" : "#ffffff";
        var themeColorMeta = document.querySelector('meta[name="theme-color"]');
        if (themeColorMeta) themeColorMeta.setAttribute("content", dark ? "#171717" : "#f7f7f8");
      })();
    </script>
  </head>
  <body class="bg-app text-fg antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
